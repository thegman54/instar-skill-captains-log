<!--
  Captain's Log admin panel.
  Self-contained Alpine.js component, loaded into a modal by the tools/profiles page.
  Calls: /api/captains_log/logs  (GET), /logs/{id} (GET, PUT, DELETE),
         /logs/{id}/approve|reject (POST), /sweep (POST)
-->
<div x-data="captainsLogAdmin()" x-init="init()" class="flex flex-col h-full" style="min-height: 520px;">

    <!-- Header -->
    <div class="flex items-center justify-between mb-3">
        <div>
            <h3 class="text-lg font-semibold text-white">Captain's Logs</h3>
            <p class="text-xs text-gray-500">
                <span x-text="logs.length"></span> logs ·
                <span class="text-sky-400" x-text="(counts.pending || 0) + ' awaiting review'"></span>
                <span x-show="counts.pending" class="text-gray-600"
                      x-text="' · unapproved logs expire after ' + ttl + 'h'"></span>
            </p>
        </div>
        <div class="flex items-center gap-2">
            <template x-for="s in ['pending','approved','abandoned','rejected','expired']" :key="s">
                <button @click="statusFilter = (statusFilter === s ? null : s)"
                    class="px-2.5 py-1 text-xs rounded transition-colors capitalize"
                    :class="statusFilter === s ? 'bg-sky-700 text-white' : 'text-gray-400 hover:text-white bg-gray-700'">
                    <span x-text="s"></span>
                    <span class="text-[10px] opacity-70" x-text="counts[s] ? '(' + counts[s] + ')' : ''"></span>
                </button>
            </template>
            <button @click="refresh(true)" class="px-2.5 py-1 text-xs rounded bg-gray-700 text-gray-300 hover:text-white"
                title="Abandon stale open logs and expire unreviewed ones">Sweep</button>
        </div>
    </div>

    <!-- Filters -->
    <div class="flex items-center gap-2 mb-3">
        <input type="text" x-model="search" placeholder="Search title, purpose, contents…"
            class="flex-1 px-2 py-1.5 bg-gray-800 border border-gray-600 rounded text-white text-xs focus:border-sky-500 focus:outline-none">
        <div class="flex items-center gap-1 flex-wrap max-w-[55%] justify-end">
            <template x-for="t in tags" :key="t">
                <button @click="toggleTag(t)"
                    class="text-[10px] px-1.5 py-0.5 rounded transition-colors"
                    :class="activeTags.includes(t) ? 'bg-sky-700 text-white' : 'bg-gray-700 text-gray-400 hover:text-white'"
                    x-text="t"></button>
            </template>
        </div>
    </div>

    <div class="flex-1 flex gap-3 min-h-0">
        <!-- Log list -->
        <div class="w-1/3 overflow-y-auto space-y-1 pr-1">
            <template x-for="l in filtered" :key="l.id">
                <div @click="open(l)"
                    class="rounded px-3 py-2 cursor-pointer transition-colors border-l-2"
                    :class="selected && selected.id === l.id
                        ? 'bg-gray-900 border-sky-500'
                        : 'bg-gray-900/40 hover:bg-gray-900/80 border-transparent'">
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-mono text-sky-400" x-text="l.stardate"></span>
                        <span class="text-[10px] px-1.5 py-0.5 rounded capitalize"
                            :class="{
                                'bg-sky-900/50 text-sky-300': l.status === 'pending',
                                'bg-emerald-900/50 text-emerald-300': l.status === 'approved',
                                'bg-amber-900/50 text-amber-300': l.status === 'abandoned',
                                'bg-red-900/40 text-red-300': l.status === 'rejected',
                                'bg-gray-800 text-gray-500': l.status === 'expired' || l.status === 'open',
                            }" x-text="l.status"></span>
                    </div>
                    <p class="text-sm text-white mt-0.5 leading-tight" x-text="l.title"></p>
                    <div class="flex items-center gap-1.5 mt-1 flex-wrap">
                        <template x-for="t in l.tags" :key="t">
                            <span class="text-[10px] px-1.5 py-0.5 bg-gray-700 text-gray-400 rounded" x-text="t"></span>
                        </template>
                        <span class="text-[10px] text-gray-600 ml-auto" x-text="l.entry_count + ' entries'"></span>
                    </div>
                </div>
            </template>
            <div x-show="filtered.length === 0" class="text-center text-gray-500 py-8 text-xs">
                No logs match.
            </div>
        </div>

        <!-- Document -->
        <div class="flex-1 bg-gray-900/50 rounded flex flex-col min-h-0">
            <template x-if="!selected">
                <div class="flex-1 flex items-center justify-center text-gray-600 text-sm">
                    Select a log to read it.
                </div>
            </template>

            <template x-if="selected">
                <div class="flex flex-col min-h-0 flex-1">
                    <!-- Doc header / actions -->
                    <div class="flex items-start justify-between gap-3 px-4 py-3 border-b border-gray-700">
                        <div class="min-w-0">
                            <p class="text-sm text-white font-medium" x-text="selected.title"></p>
                            <p class="text-[11px] text-gray-500 mt-0.5">
                                <span class="font-mono text-sky-400" x-text="selected.stardate"></span>
                                <span x-show="selected.speaker_label" x-text="' · ' + selected.speaker_label"></span>
                                <span x-show="selected.source_interface" x-text="' · ' + selected.source_interface"></span>
                                <span x-show="selected.expires_at && selected.status !== 'approved'"
                                      class="text-amber-400" x-text="' · expires ' + fmt(selected.expires_at)"></span>
                            </p>
                            <p x-show="selected.continues" class="text-[11px] text-gray-500 mt-0.5">
                                continues <span class="font-mono" x-text="selected.continues?.stardate"></span>
                                — <span x-text="selected.continues?.title"></span>
                            </p>
                        </div>
                        <div class="flex items-center gap-1.5 flex-shrink-0">
                            <button @click="download()" class="px-2.5 py-1 text-xs bg-gray-700 hover:bg-gray-600 text-gray-200 rounded">Download</button>
                            <button @click="editing = !editing" class="px-2.5 py-1 text-xs bg-gray-700 hover:bg-gray-600 text-gray-200 rounded"
                                x-text="editing ? 'Cancel' : 'Edit'"></button>
                            <button x-show="selected.status !== 'approved'" @click="act('approve')"
                                class="px-2.5 py-1 text-xs bg-emerald-700 hover:bg-emerald-600 text-white rounded">Approve</button>
                            <button x-show="selected.status !== 'rejected'" @click="act('reject')"
                                class="px-2.5 py-1 text-xs bg-red-800 hover:bg-red-700 text-white rounded">Reject</button>
                            <button @click="destroy()" class="px-2 py-1 text-xs text-gray-600 hover:text-red-400" title="Delete permanently">✕</button>
                        </div>
                    </div>

                    <!-- Edit form -->
                    <div x-show="editing" class="px-4 py-3 border-b border-gray-700 space-y-2">
                        <input type="text" x-model="form.title" placeholder="Title"
                            class="w-full px-2 py-1.5 bg-gray-800 border border-gray-600 rounded text-white text-xs focus:border-sky-500 focus:outline-none">
                        <input type="text" x-model="form.tags" placeholder="tags, comma separated"
                            class="w-full px-2 py-1.5 bg-gray-800 border border-gray-600 rounded text-white text-xs focus:border-sky-500 focus:outline-none">
                        <textarea x-model="form.markdown" rows="14"
                            class="w-full px-3 py-2 bg-gray-800 border border-gray-600 rounded text-white text-xs font-mono focus:border-sky-500 focus:outline-none resize-y leading-relaxed"></textarea>
                        <div class="flex justify-end">
                            <button @click="save()" class="px-3 py-1.5 text-xs bg-sky-700 hover:bg-sky-600 text-white rounded">Save</button>
                        </div>
                    </div>

                    <!-- Rendered document -->
                    <div x-show="!editing" class="flex-1 overflow-y-auto px-4 py-3">
                        <pre class="text-xs text-gray-300 whitespace-pre-wrap font-mono leading-relaxed" x-text="selected.markdown || '(nothing compiled)'"></pre>
                    </div>
                </div>
            </template>
        </div>
    </div>
</div>

<script>
function captainsLogAdmin() {
    return {
        logs: [], counts: {}, tags: [], ttl: 48,
        selected: null, statusFilter: null, activeTags: [], search: '',
        editing: false,
        form: { title: '', tags: '', markdown: '' },

        init() { this.refresh(); },

        get filtered() {
            const q = this.search.trim().toLowerCase();
            return this.logs.filter(l => {
                if (this.statusFilter && l.status !== this.statusFilter) return false;
                if (this.activeTags.length && !this.activeTags.every(t => l.tags.includes(t))) return false;
                if (q) {
                    const hay = [l.title, l.purpose, l.closing, l.stardate].filter(Boolean).join(' ').toLowerCase();
                    if (!hay.includes(q)) return false;
                }
                return true;
            });
        },

        toggleTag(t) {
            this.activeTags = this.activeTags.includes(t)
                ? this.activeTags.filter(x => x !== t)
                : [...this.activeTags, t];
        },

        fmt(iso) {
            if (!iso) return '';
            try { return new Date(iso).toLocaleString(); } catch { return iso; }
        },

        async refresh(sweep) {
            if (sweep) { try { await fetch('/api/captains_log/sweep', { method: 'POST' }); } catch {} }
            const resp = await fetch('/api/captains_log/logs');
            if (!resp.ok) return;
            const data = await resp.json();
            this.logs = data.logs || [];
            this.counts = data.counts || {};
            this.tags = data.tags || [];
            this.ttl = data.pending_ttl_hours || 48;
            if (this.selected) {
                const still = this.logs.find(l => l.id === this.selected.id);
                if (still) { await this.open(still); } else { this.selected = null; }
            }
        },

        async open(l) {
            this.editing = false;
            const resp = await fetch(`/api/captains_log/logs/${l.id}`);
            if (!resp.ok) return;
            this.selected = await resp.json();
            this.form = {
                title: this.selected.title || '',
                tags: (this.selected.tags || []).join(', '),
                markdown: this.selected.markdown || '',
            };
        },

        async act(action) {
            const resp = await fetch(`/api/captains_log/logs/${this.selected.id}/${action}`, { method: 'POST' });
            if (resp.ok) await this.refresh();
        },

        async save() {
            const body = {
                title: this.form.title,
                tags: this.form.tags.split(',').map(t => t.trim()).filter(Boolean),
                compiled_md: this.form.markdown,
            };
            const resp = await fetch(`/api/captains_log/logs/${this.selected.id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            });
            if (resp.ok) { this.editing = false; await this.refresh(); }
        },

        async destroy() {
            if (!confirm(`Delete captain's log ${this.selected.stardate} permanently?`)) return;
            const resp = await fetch(`/api/captains_log/logs/${this.selected.id}`, { method: 'DELETE' });
            if (resp.ok) { this.selected = null; await this.refresh(); }
        },

        download() {
            const blob = new Blob([this.selected.markdown || ''], { type: 'text/markdown' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `captains-log-${this.selected.stardate}.md`;
            a.click();
            URL.revokeObjectURL(a.href);
        },
    };
}
</script>
